name: Profile summary cards

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 1
          EXCLUDE: "SagradaFamilia,HYP-Abruzzo,Tower-of-hanoi-CG,Gamified-marketing-application-DB2,Internet_of_things_Project,CuzzucoliDeDominicis"
